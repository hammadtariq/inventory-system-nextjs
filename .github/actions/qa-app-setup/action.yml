name: QA app setup
description: >
  QA Kit: install dependencies with the repo's package manager (npm, pnpm or Yarn, from the lockfile)
  and Node version (.nvmrc, else package.json engines, else 22), export the test login, run the repo's
  .qa/app-setup.sh (database, seed, build in local-app mode) and install Playwright's browsers. In standalone
  mode (`playwrightDir` in .qa/config.json, for repos without Node) the Node side lives in that folder.
  Exports QA_TEST, the command that runs the tests from the repo root.

inputs:
  qa-user-email:
    description: Test account email (secret). .qa/app-setup.sh may override it, e.g. with a per-run account.
    default: ""
  qa-user-password:
    description: Test account password (secret)
    default: ""
  browsers:
    description: Playwright browsers to install; "auto" reads the extra devices in .qa/config.json `browsers`
    default: auto

runs:
  using: composite
  steps:
    - name: Detect package manager and Node version
      id: detect
      shell: bash
      run: |
        # The runner's own Node reads the config (setup-node runs later, once the version is known); no config means ".".
        dir=$(node -p "require('./.qa/config.json').playwrightDir || '.'" 2>/dev/null || echo .)
        if [ -f "$dir/pnpm-lock.yaml" ]; then pm=pnpm; lock=pnpm-lock.yaml
        elif [ -f "$dir/yarn.lock" ]; then pm=yarn; lock=yarn.lock
        else pm=npm; lock=package-lock.json; fi
        if [ -f "$dir/.nvmrc" ]; then node=$(tr -d 'v \n' < "$dir/.nvmrc")
        elif [ -f .nvmrc ]; then node=$(tr -d 'v \n' < .nvmrc)
        else node=$(node -p "((require('./$dir/package.json').engines||{}).node||'22').replace(/[^0-9.x]/g,'').split('.')[0] || '22'" 2>/dev/null || echo 22); fi
        if [ "$dir" = "." ]; then qa_test="npx playwright test"; pw="npx playwright"
        else qa_test="$dir/node_modules/.bin/playwright test -c $dir"; pw="$dir/node_modules/.bin/playwright"; fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "pm=$pm" >> "$GITHUB_OUTPUT"
        echo "lock=$dir/$lock" >> "$GITHUB_OUTPUT"
        echo "node=${node:-22}" >> "$GITHUB_OUTPUT"
        echo "pw=$pw" >> "$GITHUB_OUTPUT"
        echo "QA_TEST=$qa_test" >> "$GITHUB_ENV"
        echo "Playwright in: $dir, package manager: $pm, Node: ${node:-22}, tests: $qa_test"

    - name: Install pnpm
      if: steps.detect.outputs.pm == 'pnpm'
      shell: bash
      working-directory: ${{ steps.detect.outputs.dir }}
      run: |
        if node -e "process.exit(require('./package.json').packageManager ? 0 : 1)"; then corepack enable
        else npm install -g pnpm@10 --silent; fi

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.detect.outputs.node }}
        cache: ${{ steps.detect.outputs.pm }}
        cache-dependency-path: ${{ steps.detect.outputs.lock }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ steps.detect.outputs.dir }}
      run: |
        case "${{ steps.detect.outputs.pm }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) if [ -f .yarnrc.yml ]; then corepack enable && yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
          *) npm ci ;;
        esac

    - name: Test login
      shell: bash
      env:
        EMAIL: ${{ inputs.qa-user-email }}
        PASSWORD: ${{ inputs.qa-user-password }}
      run: |
        if [ -n "$EMAIL" ]; then echo "QA_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"; fi
        if [ -n "$PASSWORD" ]; then echo "::add-mask::$PASSWORD"; echo "QA_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"; fi

    # Inventory-specific: .qa/app-setup.sh runs `pnpm build`; keep its cache between runs.
    - name: Cache Next.js build cache
      uses: actions/cache@v4
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('pages/**', 'components/**', 'hooks/**', 'lib/**', 'utils/**', 'styles/**') }}
        restore-keys: |
          next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Prepare the app (.qa/app-setup.sh)
      shell: bash
      run: |
        if [ -f .qa/app-setup.sh ]; then bash .qa/app-setup.sh; else echo "No .qa/app-setup.sh"; fi

    - name: Install Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PW_DIR: ${{ steps.detect.outputs.dir }}
      run: |
        if [ "$BROWSERS" = "auto" ]; then
          # chromium, plus the engines of the devices in .qa/config.json browsers.devices (e.g. webkit for "iPhone 13").
          BROWSERS=$(node -e "
            const { devices } = require(require.resolve('@playwright/test', { paths: [require('path').resolve(process.env.PW_DIR)] }));
            const names = (require('./.qa/config.json').browsers || {}).devices || [];
            console.log([...new Set(['chromium', ...names.map((n) => devices[n] && devices[n].defaultBrowserType).filter(Boolean)])].join(' '));
          ")
        fi
        echo "Installing: $BROWSERS"
        ${{ steps.detect.outputs.pw }} install --with-deps $BROWSERS
